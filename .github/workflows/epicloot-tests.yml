name: Epic Loot source tests

on:
  push:
    paths:
      - EpicLoot.Tests/**
      - EpicLoot/src/GamePatches/SE_Rested_Patch.cs
      - EpicLoot/src/Magic/MagicItemEffects/Shards/GainMaxCarryWeightFromRested.cs
      - Directory.Build.props
      - Directory.Build.targets
      - .github/workflows/epicloot-tests.yml
  pull_request:
    paths:
      - EpicLoot.Tests/**
      - EpicLoot/src/GamePatches/SE_Rested_Patch.cs
      - EpicLoot/src/Magic/MagicItemEffects/Shards/GainMaxCarryWeightFromRested.cs
      - Directory.Build.props
      - Directory.Build.targets
      - .github/workflows/epicloot-tests.yml

jobs:
  rested-carry-weight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test EpicLoot.Tests/EpicLoot.Tests.csproj --nologo
