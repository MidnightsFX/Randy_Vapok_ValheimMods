name: Validate JSON

on:
  push:
    paths:
      - '**.json'
      - '**.jsonc'
      - '.github/workflows/validate-json.yml'
      - '.github/scripts/validate_json.py'
  pull_request:
    paths:
      - '**.json'
      - '**.jsonc'
      - '.github/workflows/validate-json.yml'
      - '.github/scripts/validate_json.py'
  workflow_dispatch:

jobs:
  json-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify JSON Syntax
        # Checks every tracked .json and .jsonc file. // and /* */ comments are allowed, because
        # EpicLoot reads its JSON with Newtonsoft, which skips them; anything else that is not JSON
        # (trailing commas, NaN, a missing quote) still fails.
        run: python3 .github/scripts/validate_json.py
